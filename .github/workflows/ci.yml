name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.117.0 # keep in sync with package.json

jobs:
  database:
    name: Database (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase db start
      - run: mkdir -p ci-logs
      - run: set -o pipefail; supabase db lint --level error 2>&1 | tee ci-logs/db-lint.log
      - run: set -o pipefail; supabase test db 2>&1 | tee ci-logs/db-test.log
      # Job logs need a token to download; annotations are public, so failures are readable without one.
      - name: Annotate failures
        if: failure()
        run: |
          node scripts/ci/annotate-log.mjs ci-logs/db-lint.log "db lint"
          node scripts/ci/annotate-log.mjs ci-logs/db-test.log "pgTAP"

  swift-linux:
    name: Swift package (Linux + local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      SWIFT_BUILD_BIND: ${{ github.workspace }}/.swift-build
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: actions/cache@v6
        with:
          path: .swift-build
          key: swift-6.3-linux-${{ hashFiles('Packages/TeamTasksKit/Package.resolved', 'Packages/TeamTasksKit/Package.swift') }}
          restore-keys: swift-6.3-linux-
      - run: supabase start -x studio,postgres-meta
      - name: swift test (unit + integration)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          node scripts/swift-docker.mjs it 2>&1 | tee ci-logs/swift-linux.log
      - name: Annotate failures
        if: failure()
        run: node scripts/ci/annotate-log.mjs ci-logs/swift-linux.log "swift test (Linux)"

  ios:
    name: iOS app (build, UI tests, screenshots)
    runs-on: macos-26
    timeout-minutes: 60
    # Read-only token, not kept in .git/config: the build and the tests run without write access (the
    # publish-screenshots job pushes the screenshots).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select latest Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Config/Secrets.xcconfig
        env:
          SUPABASE_HOST: ${{ vars.SUPABASE_HOST }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
        run: node scripts/write-secrets.mjs
      - run: xcodegen generate
      - uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ hashFiles('Packages/TeamTasksKit/Package.resolved') }}
          restore-keys: spm-
      - name: Swift package tests (macOS)
        id: swift_macos
        run: |
          set -o pipefail
          mkdir -p ci-logs
          swift test --package-path Packages/TeamTasksKit 2>&1 | tee ci-logs/swift-macos.log
      - name: Pick simulator
        id: sim
        run: |
          UDID="$(scripts/ci/pick-simulator.sh)"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Clean, stable status bar on the screenshots (best effort).
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 || true
      - name: Build & run UI tests
        id: uitests
        run: |
          set -o pipefail
          xcodebuild test \
            -project TeamTasks.xcodeproj -scheme TeamTasks \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/UITests.xcresult \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee ci-logs/xcodebuild-test.log | xcbeautify
      - name: Export screenshots
        if: always()
        run: scripts/ci/export-screenshots.sh build/UITests.xcresult build/screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: build/screenshots
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: UITests-xcresult
          path: build/UITests.xcresult
          retention-days: 7
      - name: Build unsigned IPA (for Sideloadly)
        id: ipa
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: scripts/ci/package-ipa.sh
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: Equipe-unsigned-ipa
          path: build/Equipe-unsigned.ipa
          retention-days: 30
      # Only the logs of the steps that actually failed (a green step's log has harmless "error:" lines).
      - name: Annotate swift test failures
        if: failure() && steps.swift_macos.outcome == 'failure'
        run: node scripts/ci/annotate-log.mjs ci-logs/swift-macos.log "swift test (macOS)"
      - name: Annotate UI test failures
        if: failure() && steps.uitests.outcome == 'failure'
        run: node scripts/ci/annotate-log.mjs ci-logs/xcodebuild-test.log "xcodebuild test"
      - name: Annotate IPA failures
        if: failure() && steps.ipa.outcome == 'failure'
        run: node scripts/ci/annotate-log.mjs ci-logs/xcodebuild-ipa.log "IPA build"

  # Artifacts need a token to download; a branch is public, so the screenshots can be reviewed
  # (raw.githubusercontent.com/<repo>/ci-screenshots/<name>.png) without logging in.
  # A separate job, so that only this one gets a write token: it runs no code of the repository.
  publish-screenshots:
    name: Publish screenshots (ci-screenshots branch)
    needs: ios
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # force-pushes the ci-screenshots branch
    steps:
      - uses: actions/download-artifact@v7
        continue-on-error: true # no artifact when the ios job stopped before the export
        with:
          name: screenshots
          path: build/screenshots
      # One force-pushed commit, so the branch never accumulates history.
      - name: Publish screenshots to the ci-screenshots branch
        if: hashFiles('build/screenshots/**') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/screenshots
          printf '# Captures CI\n\nCommit %s, run %s.\n' "${GITHUB_SHA::7}" "$GITHUB_RUN_ID" > README.md
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots of ${GITHUB_SHA::7} (run $GITHUB_RUN_ID)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
