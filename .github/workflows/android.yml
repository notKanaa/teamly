name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/CONTRACTS.md"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Validates the wrapper checksum. "basic" caching is the MIT-licensed provider (a thin wrapper over
      # actions/cache); the default "enhanced" provider is proprietary since gradle/actions v6.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: chmod +x ./gradlew
      # The debug APK talks to the hosted project (same repository variables as the iOS job).
      - run: ./gradlew --console=plain test :app:assembleDebug
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_HOST && format('https://{0}', vars.SUPABASE_HOST) || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Equipe-android-test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: Equipe-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
